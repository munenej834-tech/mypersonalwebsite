<!DOCTYPE html>
<html>
    <head>
        <title>Learning JS</title>
    </head>
    <body>
        <input type="text" id="john" placeholder="Enter your text">
        <br><br>
        <button id="btn" ondblClick="test()">Click me</button>
    </body>
    <script type="text/javascript">
        function test(){
            let testNumber=Number(document.getElementById("john").value);
            testNumber=Number(testNumber);
            switch(testNumber){
                case 10:
                    alert(10);
                    break;
                case 20:
                    alert(20);
                    break;
                case 30:
                    alert(30);
                    break;
                default:
                    alert("Not found");

            }
        }
        let btn=document.getElementById("btn");
        btn.addEventListener("click",test);
    
    </script>
</html>
